[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-guardian"
version = "0.1.0"
description = "A safety-first reliability layer for AI coding agents (Hermes, Goose, OpenCode, FreeBuff)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Agent Guardian Project"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "build>=1.0.0",
    # Required by the forensic ACP integration tests (tests/integration/forensic/).
    "agent-client-protocol>=0.9.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "agent-client-protocol>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/Wrybill-env/AgentGuardian"
Repository = "https://github.com/Wrybill-env/AgentGuardian"
Issues = "https://github.com/Wrybill-env/AgentGuardian/issues"

[project.scripts]
guardian = "guardian.__main__:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["guardian*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.package-data]
guardian = ["*.py", "core/**/*.py", "hermes/**/*.py", "goose/**/*.py", "opencode/**/*.py", "freebuff/**/*.py"]
